[project]
name = "aif-project2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel",
    "pandas",
    "matplotlib",
    "numpy",
    "torch",
    "transformers",
    "accelerate",
    "sentencepiece",  # T5 tokenizer
    "protobuf",       # T5 tokenizer conversion
    "pyserini",       # BM25; needs a Java 21+ JDK (JAVA_HOME in .env)
    "faiss-cpu",      # required by pyserini imports
]

[project.optional-dependencies]
vllm = ["vllm"]      # faster Llama generation: set LLAMA_BACKEND=vllm in .env
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
